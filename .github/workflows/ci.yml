name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1 (node24), pinned to commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-go v7.0.0 (node24), pinned to commit SHA.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: |
          go build ./...
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/gw .

      - name: test
        run: go test -race -count=1 ./...

      # govulncheck 是 Go 模块，不能直接跟 @latest：golang.org/x/vuln 从 v1.2.0 起
      # 要求 go >= 1.25（v1.8.0+ 要 1.26），而本项目 go.mod 是 1.24、setup-go
      # 又把 GOTOOLCHAIN 设为 local，@latest 会 300ms 内直接失败：
      #   requires go >= 1.26.0 (running go 1.24.13; GOTOOLCHAIN=local)
      # 由于 continue-on-error: true，这个失败只会在 run 上留一个红色注解（看似 CI 挂了）。
      # 这里 pin 到与 1.24 兼容的最后一个版本；升 Go 后同步抬这个版本号即可。
      # 漏洞库是运行时从 vuln.go.dev 拉的，pin 住工具不影响扫描时效。
      - name: vulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
        continue-on-error: true
