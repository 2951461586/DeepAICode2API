name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1 (node24), pinned to commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-go v7.0.0 (node24), pinned to commit SHA.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: |
          go build ./...
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/gw .

      - name: test
        run: go test -race -count=1 ./...

      # govulncheck 是 Go 模块，不能直接跟 @latest：golang.org/x/vuln 从 v1.2.0 起
      # 要求 go >= 1.25（v1.8.0+ 要 1.26），而本项目 go.mod 是 1.24、setup-go
      # 又把 GOTOOLCHAIN 设为 local，@latest 会在 300ms 内直接失败：
      #   requires go >= 1.26.0 (running go 1.24.13; GOTOOLCHAIN=local)
      # 这里 pin 到与 1.24 兼容的最后一个版本；升 Go 后同步抬这个版本号即可。
      # 漏洞库是运行时从 vuln.go.dev 拉的，pin 住工具不影响扫描时效。
      #
      # 退出码收敛为 0：本仓库是 stdlib-only，命中的多是 Go 工具链 CVE，修不修
      # 取决于要不要抬 go.mod 的版本。直接让步骤失败会在 run 页面上挂出一串
      # failure 注解（每条 trace 一条）让人以为 CI 挂了；这里报告进日志，只留一条
      # warning 提示。
      - name: vulncheck
        run: |
          set +e
          report=$(go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./... 2>&1)
          code=$?
          set -e
          printf '%s\n' "$report"
          case "$code" in
            0) echo "govulncheck: 未发现可达漏洞" ;;
            3) echo "::warning::govulncheck 发现可达漏洞（多为 Go 工具链 stdlib），详见日志；不阻塞 CI" ;;
            *) echo "::warning::govulncheck 退出码 $code（工具或网络问题），不阻塞 CI" ;;
          esac
          exit 0
