<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>登录 · DeepAICode2API</title>
<script src="/js/theme-boot.js"></script>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="180x180" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<!--
  管理口令登录页。

  为什么单独开一页而不是在控制台顶栏放输入框：
    - 顶栏那颗输入框会把「有没有口令」「输到第几位」暴露在任何能看到屏幕的人眼前；
    - 控制台是长驻页，口令框留在那儿等于把门虚掩着；
    - 登录页可以只做一件事：验一次口令，成功就进控制台（口令只留在本标签页
      的 sessionStorage 里，关掉标签页即失效）。

  文案放在 body 的 data-msg-* 上而不是写进 login.js：
  login.js 属于控制台的 i18n 扫描范围，中文字面量会被要求补英文词条；
  登录页是三语并排的固定文案，不需要走那套字典。
-->
<body class="login-body"
      data-msg-empty="请输入管理口令"
      data-msg-bad="口令不正确"
      data-msg-net="无法连接网关，请确认服务仍在运行">

<main class="login-card">
  <div class="login-brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
    </span>
    <div>
      <div class="brand-name">DeepAICode2API</div>
      <div class="brand-sub">控制台登录 · Console sign-in</div>
    </div>
  </div>

  <form id="loginForm" novalidate>
    <label class="login-label" for="loginPw">管理口令 <span class="login-sub">Admin password</span></label>
    <input id="loginPw" name="password" type="password" autocomplete="current-password"
           placeholder="请输入管理口令" autofocus required>
    <p class="login-err" id="loginErr" role="alert" hidden></p>
    <button class="btn primary login-submit" id="loginGo" type="submit">进入控制台</button>
  </form>

  <p class="login-hint">
    口令只保存在本标签页（sessionStorage），关闭标签页即失效。
    未设置管理口令时，本页直接放行（仅本机可访问管理接口）。
  </p>
</main>

<script type="module" src="/js/login.js"></script>
</body>
</html>
